# 安全公式注册表（对应方案 §5.2）
# 评估器只调用下方 func 指向的白名单安全函数，绝不 eval 模型生成的表达式。
# func 名映射到 eval/formula_eval.py 中的实现。
#
# 字段说明（D2 严格校验依赖，方案 §5.2 五步检查）：
#   func         : 白名单安全函数名
#   inputs       : 操作数 metric_key，顺序有意义（ratio 族为 [分子, 分母]）
#   signal_types : 该公式允许用于哪些 signal_type（检查「公式与异常类型是否匹配」）
#   period_mode  : single = 单年度内计算；pair = 需要 t-1 与 t 两个年度
#   role         : 操作数语义角色，与 inputs 一一对应，用于校验分子/分母方向
#   available    : false 表示当前数据 schema 中不存在该科目，D2 记为 not_applicable
formulas:
  cfo_over_netprofit:
    description: 经营现金流/净利润
    func: ratio
    inputs: [cfo, net_profit]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [cashflow_profit_divergence]
    available: true
    note: 用于 cashflow_profit_divergence 的复算
  ar_minus_rev_growth:
    description: 应收账款增速减营业收入增速（小数，0.25=25个百分点）
    func: growth_diff_pp
    inputs: [accounts_receivable, revenue]
    role: [growth_a, growth_b]
    period_mode: pair
    signal_types: [receivables_revenue_divergence]
    available: true
    note: 用于 receivables_revenue_divergence
  inv_minus_cogs_growth:
    description: 存货增速减营业成本增速（小数，0.25=25个百分点）
    func: growth_diff_pp
    inputs: [inventory, cogs]
    role: [growth_a, growth_b]
    period_mode: pair
    signal_types: [inventory_cost_divergence]
    available: true
    note: 用于 inventory_cost_divergence
  gross_net_margin_gap:
    description: 毛利率变化减净利率变化（小数，0.02=2个百分点）
    func: margin_gap_pp
    inputs: [revenue, cogs, net_profit]
    role: [revenue, cogs, net_profit]
    period_mode: pair
    signal_types: [gross_net_margin_divergence]
    available: true
    note: 用于 gross_net_margin_divergence
  nonrecurring_over_netprofit:
    description: 非经常性损益绝对值/净利润绝对值
    func: abs_ratio
    inputs: [nonrecurring, net_profit]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [nonrecurring_profit_dependence]
    available: true
    note: 用于 nonrecurring_profit_dependence
  goodwill_over_equity:
    description: 商誉/所有者权益
    func: ratio
    inputs: [goodwill, equity]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [goodwill_net_assets_pressure]
    available: true
    note: 用于 goodwill_net_assets_pressure
  current_ratio:
    description: 流动资产/流动负债
    func: ratio
    inputs: [current_assets, current_liabilities]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [short_term_solvency_pressure]
    available: true
    note: 用于 short_term_solvency_pressure
  short_debt_over_cash:
    description: 短期借款/货币资金
    func: ratio
    inputs: [short_borrow, cash]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [short_term_solvency_pressure]
    available: true
    note: 用于 short_term_solvency_pressure
  impairment_yoy_growth:
    description: 减值损失同比增幅（小数，1.0=100%）
    func: yoy_growth
    inputs: [impairment]
    role: [series]
    period_mode: pair
    signal_types: [impairment_loss_surge]
    available: false
    note: 当前合成数据无减值损失科目，D2 记为 not_applicable
  impairment_over_totalprofit:
    description: 减值损失绝对值/利润总额绝对值
    func: abs_ratio
    inputs: [impairment, total_profit]
    role: [numerator, denominator]
    period_mode: single
    signal_types: [impairment_loss_surge]
    available: false
    note: 当前合成数据无减值损失/利润总额科目，D2 记为 not_applicable
